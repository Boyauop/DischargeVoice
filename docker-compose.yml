services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dischargevoice
      POSTGRES_PASSWORD: dischargevoice
      POSTGRES_DB: dischargevoice
    ports:
      - "5432:5432"
    volumes:
      - dischargevoice-postgres:/var/lib/postgresql/data
volumes:
  dischargevoice-postgres:
